name: Actualiser le dashboard

on:
  schedule:
    - cron: "30 5 * * *"     # SECOURS : GitHub démarre ce lancement avec 6 à 8 heures de retard. Le serveur déclenche le vrai lancement à 6h30 (voir document 09).
  workflow_dispatch:          # bouton « Run workflow », et déclenchement automatique par le serveur
    inputs:
      complet:
        description: "Écrire 1 pour forcer une actualisation complète (sinon : légère sauf le lundi)"
        required: false
        default: ""
      mail:
        description: "Écrire 1 pour envoyer aussi le mail du matin (le serveur l'écrit tous les jours à 6h30)"
        required: false
        default: ""


permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Le lancement de secours de GitHub ne fait rien si le mail du jour est déjà parti (évite deux mails le même jour).
  garde:
    runs-on: ubuntu-latest
    outputs:
      deja: ${{ steps.g.outputs.deja }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          deja=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f history/dernier-envoi.txt ] && [ "$(cat history/dernier-envoi.txt)" = "$(TZ=Europe/Paris date +%F)" ]; then deja=true; fi
          echo "deja=$deja" >> "$GITHUB_OUTPUT"

  build:
    needs: garde
    if: needs.garde.outputs.deja != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Récupérer les données, calculer et chiffrer
        env:
          LN_KEY: ${{ secrets.LN_KEY }}
          EM_PASSPHRASE: ${{ secrets.EM_PASSPHRASE }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          EM_USERS: ${{ secrets.EM_USERS }}
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.txt
          FORCE_FULL: ${{ github.event.inputs.complet }}
        run: python refresh.py
      - name: Sauvegarder l'historique des feux (fichier chiffré)
        run: |
          if [ -f history/feux.enc ]; then
            git config user.name "actualisation-auto"
            git config user.email "actions@users.noreply.github.com"
            git add history/feux.enc
            git commit -m "Historique des feux $(date -u +%F)" || true
            git pull --rebase || true
            git push || true
          fi
      - name: Envoyer le mail du matin (lancement du serveur ou de secours, et seulement si MAIL_MODE est réglé)
        id: mail
        if: github.event_name == 'schedule' || github.event.inputs.mail == '1'
        continue-on-error: true
        env:
          EM_PASSPHRASE: ${{ secrets.EM_PASSPHRASE }}
          DATA_FILE: site/data.txt
          MAIL_MODE: ${{ secrets.MAIL_MODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          GHL_APP_URL: ${{ secrets.GHL_APP_URL }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          TRAITE_URL: ${{ secrets.TRAITE_URL }}
          TRAITE_TOKEN: ${{ secrets.TRAITE_TOKEN }}
        run: python send_mail.py
      - name: Noter l'envoi du jour (le lancement de secours de GitHub ne renverra pas de mail)
        if: steps.mail.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.mail == '1')
        run: |
          TZ=Europe/Paris date +%F > history/dernier-envoi.txt
          git config user.name "actualisation-auto"
          git config user.email "actions@users.noreply.github.com"
          git add history/dernier-envoi.txt
          git commit -m "Mail du matin envoyé le $(TZ=Europe/Paris date +%F)" || true
          git pull --rebase || true
          git push || true
      - name: Ajouter le logo du mail au site publié
        run: cp -f logo-mail.png site/logo-mail.png || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Signe de vie : GitHub désactive les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      - name: Signe de vie (1 fois par mois)
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u +"%Y-%m-%d" > derniere-activite.txt
            git config user.name "actualisation-auto"
            git config user.email "actions@users.noreply.github.com"
            git add derniere-activite.txt
            git commit -m "Signe de vie mensuel" || true
            git push || true
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
